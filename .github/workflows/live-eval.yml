name: Live eval (manual, spends money)

on:
  workflow_dispatch:
    inputs:
      model:
        default: claude-opus-5-5
      limit:
        default: "20"
      budget_usd:
        default: "1"
      min_task_success:
        description: Fail the run below this task success rate
        default: "0.8"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run eval subset
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/run_eval.py --model "${{ inputs.model }}" --limit "${{ inputs.limit }}" --budget-usd "${{ inputs.budget_usd }}"
          python -c "import json,sys; s=json.load(open('reports/summary-${{ inputs.model }}.json')); print(s['task_success']); sys.exit(s['task_success'] < float('${{ inputs.min_task_success }}'))"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-${{ inputs.model }}
          path: reports/
